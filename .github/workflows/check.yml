name: Check and Test

env:
  # Pin the toolchain used by the acceptance CI. This release reports moonc 0.10.7.
  MOONBIT_INSTALL_VERSION: 0.1.20260807

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: MoonBit ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Install native dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install gcc

      - name: Install native dependencies on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Install MoonBit on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Show toolchain and update dependencies
        run: |
          moon version --all
          moon update

      - name: Check all targets
        run: moon check --target all --deny-warn

      - name: Build all targets
        run: moon build --target all --deny-warn

      - name: Test all targets
        run: moon test --target all --deny-warn

      - name: Run reproducible benchmark
        run: moon run cmd/benchmark --target wasm-gc

      - name: Verify formatting and generated interfaces
        shell: bash
        run: |
          moon fmt
          # MoonBit 0.10.7 rewrites executable package metadata from
          # options(is_main: true) to obsolete pkgtype syntax. Restore the
          # two known metadata files before validating the real diff.
          git restore -- cmd/demo/moon.pkg cmd/benchmark/moon.pkg
          git diff -- '*.mbt' '*.mbti'
          git diff --exit-code
          moon info
          git diff --exit-code
          git status --short
